<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kiosken · MoskeeApp</title><link rel="stylesheet" href="/portal.css"><style>.wide{grid-column:1/-1}.intro{max-width:760px;color:#687873}.kiosk-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}.kiosk-card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:25px;box-shadow:0 18px 50px #12332e0a}.kiosk-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}.kiosk-number{display:grid;place-items:center;width:46px;height:46px;border-radius:14px;background:var(--mint);color:var(--green);font-size:20px;font-weight:900}.kiosk-status{padding:6px 10px;border-radius:999px;background:#fff4d8;color:#785d18;font-size:11px;font-weight:800}.kiosk-status.ok{background:#dcf4e9;color:#0d6b58}.kiosk-fields{display:grid;grid-template-columns:1fr 130px;gap:13px}.kiosk-fields .name{grid-column:1/-1}.kiosk-actions{display:flex;align-items:center;gap:9px;margin-top:20px}.open{margin-left:auto;border:1px solid var(--green);color:var(--green);padding:11px 14px;border-radius:10px;text-decoration:none;font-weight:800}.remove{border:0;background:#fde7e4;color:#94372f;padding:11px 14px;border-radius:10px;font-weight:700;cursor:pointer}.toolbar{display:flex;gap:10px}.secondary{border:1px solid var(--line);background:white;color:var(--green);padding:14px 18px;border-radius:10px;font-weight:800;cursor:pointer}@media(max-width:900px){.kiosk-list{grid-template-columns:1fr}.toolbar{margin-top:15px;flex-direction:column}.kiosk-fields{grid-template-columns:1fr}.kiosk-fields .name{grid-column:auto}}</style></head><body><main class="console"><aside class="side"><div class="side-brand"><span class="mark">✦</span><div><strong>MoskeeApp</strong><small>Kiosken</small></div></div><nav></nav><button class="logout" id="logout">Uitloggen</button></aside><section class="content"><header><div><h1>Kiosk</h1><p class="intro">Beheer iedere donatiekiosk afzonderlijk. Elke kiosk heeft een eigen URL en kan aan een eigen CCV-pinautomaat worden gekoppeld.</p></div><div class="toolbar"><button class="secondary" id="add">+ Kiosk toevoegen</button><button class="primary" id="save">Alles opslaan</button></div></header><div class="notice" id="notice"></div><section class="kiosk-list" id="kiosks"></section></section></main><script type="module" src="/kiosk.js"></script></body></html>
