<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mijn beschikbaarheid · OrangeMasjid</title><link rel="stylesheet" href="/portal.css"><style>.portal{max-width:960px;margin:auto;padding:45px 22px}.portal header{display:flex;align-items:center;justify-content:space-between;margin-bottom:30px}.portal h1{font-size:45px}.slots{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.slot{display:flex;gap:14px;align-items:center;background:white;border:1px solid var(--line);border-radius:15px;padding:18px;cursor:pointer}.slot input{width:22px;height:22px;margin:0}.slot.assigned{border-color:#d5aa54;background:#fff9eb}.slot strong{display:block}.slot small{color:#687873}.toolbar{display:flex;gap:10px}.secondary{border:1px solid var(--green);background:white;color:var(--green);padding:12px 15px;border-radius:9px}.notice{margin-bottom:18px}@media(max-width:700px){.slots{grid-template-columns:1fr}.portal header{display:block}.toolbar{margin-top:18px}.portal h1{font-size:38px}}</style></head><body><main class="portal"><header><div><span class="mark">✦</span><small id="organization"></small><h1>Mijn beschikbaarheid</h1><p id="welcome"></p></div><div class="toolbar"><button class="secondary" id="logout">Uitloggen</button><button class="primary" id="save">Opslaan</button></div></header><div class="notice" id="notice"></div><section class="slots" id="slots"></section></main><script type="module" src="/vrijwilligersportaal.js"></script></body></html>
