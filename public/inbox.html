<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Inbox · OrangeMasjid</title><link rel="stylesheet" href="/portal.css"><style>
.inbox-shell{display:grid;grid-template-columns:360px minmax(0,1fr);height:calc(100vh - 150px);min-height:620px;background:#fff;border:1px solid #dfe6e2;border-radius:22px;overflow:hidden;box-shadow:0 20px 50px #1232}.mail-list{border-right:1px solid #e4e9e6;overflow:auto;background:#f8faf9}.mail-tools{position:sticky;top:0;background:#f8faf9eF;backdrop-filter:blur(12px);padding:16px;border-bottom:1px solid #e4e9e6;z-index:2}.mail-tools input{margin:0}.mail-row{display:block;width:100%;border:0;border-bottom:1px solid #e7ece9;background:transparent;text-align:left;padding:17px 18px;cursor:pointer;color:#17342f}.mail-row:hover,.mail-row.active{background:#edf6f2}.mail-row.unread{background:#fff}.mail-row.unread .mail-subject{font-weight:800}.mail-from,.mail-meta{display:flex;justify-content:space-between;gap:12px}.mail-from{font-size:13px;font-weight:650}.mail-date{white-space:nowrap;color:#71807b;font-size:11px}.mail-subject{margin-top:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.mail-reader{overflow:auto;padding:34px 42px}.empty-mail{height:100%;display:grid;place-content:center;text-align:center;color:#71807b}.message-head{border-bottom:1px solid #e4e9e6;padding-bottom:22px;margin-bottom:25px}.message-head h2{font-size:27px;margin:7px 0 14px}.message-address{font-size:13px;color:#60726c;line-height:1.6}.message-body{white-space:pre-wrap;line-height:1.7;font:15px/1.7 system-ui;color:#203c36}.toolbar{display:flex;gap:10px;flex-wrap:wrap}.dialog{width:min(720px,calc(100% - 30px));border:0;border-radius:20px;padding:0;box-shadow:0 30px 90px #0005}.dialog::backdrop{background:#082f2acc}.dialog-inner{padding:28px}.dialog-head{display:flex;align-items:center;justify-content:space-between}.close{border:0;background:transparent;font-size:28px;cursor:pointer}.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}.wide{grid-column:1/-1}.check{display:flex;gap:10px;align-items:center}.check input{width:auto;margin:0}.compose textarea{min-height:230px}.settings-note{background:#fff7df;border-left:4px solid #d5aa54;padding:12px;border-radius:8px}.status-dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#c44;margin-right:7px}.status-dot.ok{background:#19a474}@media(max-width:900px){.inbox-shell{grid-template-columns:1fr;height:auto;min-height:0}.mail-list{max-height:440px;border-right:0;border-bottom:1px solid #e4e9e6}.mail-reader{min-height:500px;padding:24px}.fields{grid-template-columns:1fr}.wide{grid-column:auto}}</style></head><body><main class="console"><aside class="side"><div class="side-brand"><span class="mark">✦</span><div><strong>OrangeMasjid</strong><small>Inbox</small></div></div><nav></nav><button class="logout" id="logout">Uitloggen</button></aside><section class="content"><header><div><h1>Inbox</h1><p><span class="status-dot" id="mail-dot"></span><span id="mail-status">E-mailkoppeling controleren…</span></p></div><div class="toolbar"><button class="secondary" id="settings">E-mailinstellingen</button><button class="secondary" id="refresh">Vernieuwen</button><button class="primary" id="compose">+ Nieuw bericht</button></div></header><div class="notice" id="notice"></div><section class="inbox-shell"><aside class="mail-list"><div class="mail-tools"><input id="search" type="search" placeholder="Zoek in afzender of onderwerp"></div><div id="messages"></div></aside><article class="mail-reader" id="reader"><div class="empty-mail"><div><div style="font-size:50px">✉</div><h2>Selecteer een bericht</h2><p>Uw e-mail verschijnt hier.</p></div></div></article></section></section></main>
<dialog class="dialog compose" id="compose-dialog"><div class="dialog-inner"><div class="dialog-head"><div><small>Webmail</small><h2>Nieuw bericht</h2></div><button class="close" id="close-compose" type="button">×</button></div><form id="compose-form"><label>Aan<input name="to" type="text" required placeholder="naam@voorbeeld.nl"></label><label>CC <small>optioneel</small><input name="cc" type="text"></label><label>Onderwerp<input name="subject" required maxlength="250"></label><label>Bericht<textarea name="text" required></textarea></label><input name="inReplyTo" type="hidden"><button class="primary">Verzenden</button><p class="error" id="compose-error"></p></form></div></dialog>
<dialog class="dialog" id="settings-dialog"><div class="dialog-inner"><div class="dialog-head"><div><small>Per moskee</small><h2>E-mailinstellingen</h2></div><button class="close" id="close-settings" type="button">×</button></div><p class="settings-note">IMAP haalt binnenkomende e-mail op. SMTP wordt gebruikt voor verzenden. De wachtwoorden worden versleuteld opgeslagen.</p><form id="settings-form"><div class="fields"><label>Weergavenaam<input name="displayName" required></label><label>E-mailadres<input name="emailAddress" type="email" required></label><label class="wide">Gebruikersnaam<input name="username" required></label><label>IMAP-server<input name="imapHost" required placeholder="imap.voorbeeld.nl"></label><label>IMAP-poort<input name="imapPort" type="number" min="1" max="65535" value="993" required></label><label class="check"><input name="imapSecure" type="checkbox" checked> Beveiligde IMAP (TLS)</label><span></span><label>SMTP-server<input name="smtpHost" required placeholder="smtp.voorbeeld.nl"></label><label>SMTP-poort<input name="smtpPort" type="number" min="1" max="65535" value="465" required></label><label class="check"><input name="smtpSecure" type="checkbox" checked> Beveiligde SMTP (TLS)</label><span></span><label class="wide">Wachtwoord <small id="password-hint">leeg laten om bestaand wachtwoord te behouden</small><input name="password" type="password" autocomplete="new-password"></label></div><button class="primary">Instellingen opslaan</button><p class="error" id="settings-error"></p></form></div></dialog>
<script type="module" src="/inbox.js"></script></body></html>
