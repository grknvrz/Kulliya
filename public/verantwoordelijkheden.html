<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Verantwoordelijkheden · MoskeeApp</title><link rel="stylesheet" href="/portal.css"><style>.wide{grid-column:1/-1}.responsibility-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.responsibility{background:#fff;border:1px solid var(--line);border-radius:20px;padding:23px;box-shadow:0 16px 45px #12332e0a}.responsibility h2{font-size:24px;margin:12px 0 8px}.responsibility p{color:#687873;line-height:1.55;min-height:44px}.frequency{display:inline-block;background:var(--mint);color:var(--green);padding:6px 9px;border-radius:999px;font-size:11px;font-weight:800}.people{display:flex;gap:7px;flex-wrap:wrap;margin-top:17px}.person{background:#fff4d8;color:#66501e;padding:7px 9px;border-radius:9px;font-size:12px;font-weight:700}.actions{display:flex;gap:7px;margin-top:20px}.small{border:1px solid var(--line);background:#fff;padding:8px 10px;border-radius:8px;cursor:pointer}.small.remove{color:#94372f}.empty{grid-column:1/-1;padding:55px;text-align:center;color:#74807c;background:#fff;border:1px dashed var(--line);border-radius:20px}.modal{position:fixed;inset:0;z-index:20;background:#082f2ac4;display:grid;place-items:center;padding:20px}.modal-card{background:#fff;border-radius:22px;padding:27px;width:min(680px,100%);max-height:92vh;overflow:auto}.modal-card textarea{width:100%;padding:14px;border:1px solid var(--line);border-radius:10px;margin-top:7px;font:inherit}.responsibles{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}.responsible{display:flex;gap:9px;align-items:center;border:1px solid var(--line);padding:10px;border-radius:9px}.responsible input{width:auto;margin:0}.form-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:20px}.secondary{border:1px solid var(--line);background:#fff;color:var(--ink);padding:11px 14px;border-radius:9px;font-weight:700;cursor:pointer}@media(max-width:850px){.responsibility-grid{grid-template-columns:1fr}.responsibles{grid-template-columns:1fr}}</style></head><body><main class="console"><aside class="side"><div class="side-brand"><span class="mark">✦</span><div><strong>MoskeeApp</strong><small>Vaste verantwoordelijkheden</small></div></div><nav></nav><button class="logout" id="logout">Uitloggen</button></aside><section class="content"><header><div><h1>Verantwoordelijkheden</h1><p>Leg vaste taken en structurele rollen binnen het bestuur vast.</p></div><button class="primary" id="add">+ Verantwoordelijkheid</button></header><div class="notice" id="notice"></div><section class="responsibility-grid" id="list"></section></section></main><div class="modal" id="modal" hidden><form class="modal-card" id="form"><h2 id="form-title">Nieuwe verantwoordelijkheid</h2><input name="id" type="hidden"><div class="fields"><label class="wide">Vaste verantwoordelijkheid<input name="title" maxlength="180" required placeholder="Bijv. Bestuursvergaderingen organiseren"></label><label class="wide">Omschrijving<textarea name="description" rows="5" maxlength="5000" placeholder="Beschrijf wat er structureel verwacht wordt."></textarea></label><label>Herhaling<select name="frequency"><option value="continuous">Doorlopend</option><option value="weekly">Wekelijks</option><option value="monthly">Maandelijks</option><option value="quarterly">Per kwartaal</option><option value="yearly">Jaarlijks</option></select></label><div class="wide"><label>Verantwoordelijke bestuurder(s)</label><div class="responsibles" id="responsibles"></div></div></div><p class="error" id="form-error"></p><div class="form-actions"><button class="secondary" id="cancel" type="button">Annuleren</button><button class="primary">Opslaan</button></div></form></div><script type="module" src="/verantwoordelijkheden.js"></script></body></html>
