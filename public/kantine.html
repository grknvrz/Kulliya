<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kantine · OrangePOS</title><style>:root{--gold:#a26f29;--gold2:#d5ad74;--ink:#f4f7f9;--dark:#080d12;--panel:#121a23;--card:#18222d;--line:#303c48;--muted:#9aa6b2}*{box-sizing:border-box}body{margin:0;background:var(--dark);color:var(--ink);font-family:Segoe UI,Arial,sans-serif}button,input{font:inherit}button{cursor:pointer}.top{height:88px;display:flex;align-items:center;gap:28px;padding:0 26px;background:#0a1016;border-bottom:1px solid var(--line);box-shadow:0 8px 24px #0005}.brand img{width:195px;height:60px;object-fit:contain;filter:invert(1) grayscale(1) brightness(2)}.brand{display:flex;align-items:center}.switcher{display:grid;grid-template-columns:1fr 1fr;gap:5px;padding:5px;border:1px solid var(--line);border-radius:12px;background:#111923}.switcher button{min-width:145px;padding:12px 20px;border:0;border-radius:8px;background:transparent;color:var(--muted);font-weight:800;text-align:left}.switcher button.active{background:var(--gold);color:#fff}.back{margin-left:auto;color:#c9d1d8;text-decoration:none;font-weight:700}.pos{display:grid;grid-template-columns:370px minmax(0,1fr);min-height:calc(100vh - 88px)}.cart-panel{position:sticky;top:88px;height:calc(100vh - 88px);display:flex;flex-direction:column;background:var(--panel);border-right:1px solid var(--line)}.cart-head{padding:25px 24px 16px}.cart-head h1{font-size:25px;margin:0}.cart-head small{color:var(--muted)}.cart{flex:1;overflow:auto;padding:4px 24px;border-block:1px solid var(--line)}.empty{height:100%;display:grid;place-items:center;text-align:center;color:#73808c}.line{display:grid;grid-template-columns:1fr auto 75px;gap:10px;align-items:center;padding:15px 0;border-bottom:1px solid var(--line)}.line small{display:block;color:var(--muted);margin-top:3px}.qty{display:flex;align-items:center;gap:7px}.qty button{width:29px;height:29px;border:1px solid #465462;border-radius:7px;background:#222e3a;color:#fff}.line>strong{text-align:right;color:var(--gold2)}.totals{padding:17px 24px}.total{display:flex;justify-content:space-between;align-items:center;font-size:23px}.checkout{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 24px 24px}.checkout button{padding:15px;border-radius:9px;font-weight:900}.checkout button:disabled{opacity:.35}.cash{border:1px solid #4d5b66;background:#222e3a;color:#fff}.pin{border:0;background:var(--gold);color:#fff}.catalog{padding:30px;overflow:auto;background:#0d141c}.catalog-head{display:flex;justify-content:space-between;align-items:end;margin-bottom:22px}.catalog-head h2{font-size:34px;margin:0}.catalog-head p{color:var(--muted);margin:5px 0 0}.products{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:13px}.product{min-height:145px;padding:18px;border:1px solid var(--line);border-radius:11px;background:var(--card);color:#fff;text-align:left;transition:.15s}.product:hover{transform:translateY(-2px);border-color:#667583}.product .product-mark{display:grid;place-items:center;width:35px;height:35px;border-radius:8px;background:#222e3a;color:var(--gold2);font-size:18px;font-weight:900}.product b{display:block;font-size:17px;margin-top:24px}.product strong{display:inline-block;margin-top:9px;color:var(--gold2)}.product span{float:right;color:var(--gold2);font-size:22px}.admin{padding:34px;max-width:1100px;margin:auto}.admin h1{font-size:38px}.admin-grid{display:grid;grid-template-columns:360px 1fr;gap:20px}.admin-card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:24px}.admin label{display:block;color:var(--muted);font-size:13px;font-weight:700;margin-top:16px}.admin input{width:100%;margin-top:7px;padding:13px;border:1px solid #3b4957;border-radius:8px;background:#1b2631;color:#fff}.save{width:100%;margin-top:19px;padding:14px;border:0;border-radius:8px;background:var(--gold);color:#fff;font-weight:900}.product-row{display:grid;grid-template-columns:1fr auto auto;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}.product-row small{display:block;color:var(--muted)}.edit,.remove{border:1px solid #465462;background:#222e3a;color:#fff;padding:8px 11px;border-radius:7px}.remove{color:#ffaaa2}.notice{min-height:20px;color:var(--gold2);margin-top:12px}.sales{margin-top:20px}.sale{display:flex;justify-content:space-between;gap:15px;padding:10px 0;border-bottom:1px solid var(--line);font-size:13px}.sale span{color:var(--muted)}.overlay{position:fixed;z-index:30;inset:0;display:grid;place-items:center;background:#05090de8;padding:20px}.modal{width:min(460px,100%);padding:34px;border:1px solid var(--line);border-radius:18px;background:var(--panel);text-align:center;box-shadow:0 30px 90px #0009}.modal .tick{font-size:50px;color:#61c28a}.modal h2{font-size:31px}.modal p{color:var(--muted)}.modal button{padding:12px 18px;border:0;border-radius:8px;background:var(--gold);color:#fff;font-weight:800}[hidden]{display:none!important}@media(max-width:850px){.top{height:auto;flex-wrap:wrap;padding:14px}.brand img{width:150px}.switcher{order:3;width:100%}.switcher button{min-width:0}.pos{display:block}.cart-panel{position:static;height:auto;min-height:360px}.cart{min-height:220px}.catalog{padding:22px 15px}.products{grid-template-columns:repeat(2,minmax(0,1fr))}.admin-grid{grid-template-columns:1fr}}</style></head><body><header class="top"><a class="brand" href="/kantine.html"><img src="/media/orangepos-logo.png" alt="OrangePOS"></a><div class="switcher"><button class="active" data-view="pos">A · Kassa</button><button data-view="products">B · Producten</button></div><a class="back" href="/console.html">Beheeromgeving ↗</a></header><main id="pos-view" class="pos"><aside class="cart-panel"><div class="cart-head"><h1>Winkelwagen</h1><small id="cart-subtitle">0 artikelen</small></div><div class="cart" id="cart"></div><div class="totals"><div class="total"><span>Totaal</span><strong id="total">€ 0,00</strong></div></div><div class="checkout"><button class="cash" data-pay="cash" disabled>Contant</button><button class="pin" data-pay="card" disabled>PIN</button></div></aside><section class="catalog"><div class="catalog-head"><div><h2>Kantine</h2><p>Kies een product om het aan de winkelwagen toe te voegen.</p></div><small id="product-count"></small></div><div class="products" id="products"></div></section></main><main id="products-view" class="admin" hidden><h1>Producten</h1><p style="color:var(--muted)">Beheer maximaal twintig kantineproducten. Wijzigingen staan direct in de kassa.</p><div class="admin-grid"><form class="admin-card" id="product-form"><h2 id="form-title">Product toevoegen</h2><input type="hidden" name="id"><label>Productnaam<input name="name" required maxlength="80" placeholder="Bijv. Koffie"></label><label>Verkoopprijs (€)<input name="price" type="number" min="0" max="10000" step="0.01" required></label><button class="save">Product opslaan</button><button type="button" class="edit" id="cancel-edit" hidden style="margin-top:10px">Annuleren</button><div class="notice" id="notice"></div></form><section><article class="admin-card"><h2>Productenlijst</h2><div id="product-list"></div></article><article class="admin-card sales"><h2>Laatste verkopen</h2><div id="sales"></div></article></section></div></main><div class="overlay" id="success" hidden><div class="modal"><div class="tick">✓</div><h2>Betaling geregistreerd</h2><p id="success-copy"></p><button id="new-sale">Nieuwe verkoop</button></div></div><script type="module" src="/kantine.js"></script></body></html>
