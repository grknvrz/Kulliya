<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lid worden · OrangeMasjid</title><link rel="stylesheet" href="/portal.css"><style>.product-list{display:grid;gap:10px;margin-top:10px}.product-option{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;border:1px solid #dce3df;border-radius:12px;padding:14px;margin:0}.product-option:has(input:checked){border-color:#0d6b58;background:#eef8f3}.product-option input{width:20px;height:20px;margin:0}.product-option small{display:block;color:#70807a}.product-option b{color:#0d6b58;white-space:nowrap}</style></head><body><main class="auth"><section class="auth-visual"><h1>Word lid van onze gemeenschap.</h1><p>Kies uw doorlopende donatie en ontvang een persoonlijk lidnummer voor uw kwitanties.</p></section><section class="auth-form"><form class="panel" id="form"><span class="mark">✦</span><h2>Lid aanmelden</h2><p id="organization">Maak uw persoonlijke ledenaccount aan.</p><label>Volledige naam<input name="name" required></label><label>E-mailadres<input name="email" type="email" required></label><label>Telefoonnummer <small>optioneel</small><input name="phone" type="tel"></label><label>Wachtwoord<input name="password" type="password" minlength="8" required></label><label>Kies uw doorlopende donatie <small>meerdere opties mogelijk</small></label><div class="product-list" id="products"><p>Producten laden…</p></div><button class="primary">Aanmelden en donatie starten →</button><p class="error" id="error"></p><p class="switch">Al lid? <a href="/ledenlogin">Inloggen met lidnummer</a></p></form></section></main><script type="module" src="/member-signup.js"></script></body></html>
