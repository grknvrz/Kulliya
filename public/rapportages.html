<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rapportages · MoskeeApp</title><link rel="stylesheet" href="/portal.css"><style>.filters{display:flex;gap:12px;align-items:end;flex-wrap:wrap;background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px;margin-bottom:20px}.filters label{margin:0;min-width:190px}.filters button{height:47px}.secondary{border:1px solid var(--green);background:#fff;color:var(--green);padding:14px 18px;border-radius:10px;font-weight:800;cursor:pointer}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:20px}.stat{padding:22px;border-radius:18px;background:#fff;border:1px solid var(--line)}.stat small{color:#6d7b77}.stat strong{display:block;font-size:30px;margin-top:8px}.report-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.breakdown{display:grid;gap:14px;margin-top:18px}.bar-head{display:flex;justify-content:space-between;gap:12px;font-size:13px}.track{height:9px;background:#edf1ef;border-radius:20px;overflow:hidden;margin-top:7px}.fill{height:100%;min-width:3px;background:linear-gradient(90deg,var(--green),#36a286);border-radius:20px}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:760px}.table th,.table td{text-align:left;border-bottom:1px solid #e6e9e7;padding:13px 9px;font-size:13px}.wide{grid-column:1/-1}.empty{color:#74807c;padding:18px 0}.period{color:#687873}.daily{height:150px;display:flex;align-items:flex-end;gap:5px;margin-top:22px;border-bottom:1px solid var(--line)}.daybar{flex:1;min-width:5px;background:#74bea9;border-radius:5px 5px 0 0;position:relative}.daybar:hover{background:var(--green)}.daybar span{display:none;position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);background:#082f2a;color:#fff;padding:5px 7px;border-radius:6px;font-size:11px;white-space:nowrap;z-index:2}.daybar:hover span{display:block}@media(max-width:900px){.stats,.report-grid{grid-template-columns:1fr}.wide{grid-column:auto}}</style></head><body><main class="console"><aside class="side"><div class="side-brand"><span class="mark">✦</span><div><strong>MoskeeApp</strong><small>Rapportages</small></div></div><nav></nav><button class="logout" id="logout">Uitloggen</button></aside><section class="content"><header><div><h1>Rapportages</h1><p>Analyseer ontvangen donaties per periode, type en betaalmethode.</p></div><button class="secondary" id="csv">Download CSV</button></header><div class="notice" id="notice"></div><form class="filters" id="filters"><label>Van<input type="date" name="from" required></label><label>Tot en met<input type="date" name="to" required></label><button class="primary">Rapport tonen</button><span class="period" id="period"></span></form><div class="stats"><article class="stat"><small>Totaal ontvangen</small><strong id="total">€ 0,00</strong></article><article class="stat"><small>Aantal donaties</small><strong id="count">0</strong></article><article class="stat"><small>Gemiddelde donatie</small><strong id="average">€ 0,00</strong></article></div><div class="report-grid"><article class="card"><h2>Per betaalmethode</h2><div class="breakdown" id="methods"></div></article><article class="card"><h2>Per donatiesoort</h2><div class="breakdown" id="types"></div></article><article class="card wide"><h2>Ontvangsten per dag</h2><div class="daily" id="daily"></div></article><article class="card wide"><h2>Donaties in deze periode</h2><div class="table-wrap"><table class="table"><thead><tr><th>Datum</th><th>Type</th><th>Betaalmethode</th><th>Bron</th><th>Bedrag</th><th>Referentie</th></tr></thead><tbody id="transactions"></tbody></table></div></article></div></section></main><script type="module" src="/rapportages.js"></script></body></html>
