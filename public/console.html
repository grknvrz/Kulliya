<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Console · OrangePOS</title><link rel="stylesheet" href="/portal.css"></head><body><main class="console"><aside class="side"><div class="side-brand"><span class="mark">✦</span><div><strong>OrangePOS</strong><small id="role">Console</small></div></div><nav><a href="#">Instellingen</a></nav><button class="logout" id="logout">Uitloggen</button></aside><section class="content"><header><div><h1 id="title">Instellingen</h1><p>Beheer het donatiescherm.</p></div><button class="primary" id="save">Wijzigingen opslaan</button></header><div class="master-select" id="master" hidden><label>Bekijk een aangemelde moskee<select id="tenant-select"></select></label></div><div class="notice" id="notice"></div><div class="grid"><article class="card"><h2>Publiek scherm</h2><p>Unieke URL voor deze moskee.</p><div class="public-link"><code id="public-url"></code><a id="public-open" target="_blank">Open ↗</a></div></article><article class="card"><h2>Organisatie</h2><label>Moskeenaam<input id="organization"></label></article><article class="card"><h2>Donatiebedragen</h2><label>Bedragen, gescheiden door komma's<input id="amount-input"></label><div class="amounts" id="amounts"></div></article><article class="card"><h2>Gebedstijden</h2><div class="fields"><label>Plaats<input id="city"></label><label>Landcode<input id="country" maxlength="2"></label></div></article></div></section></main><script type="module" src="/console.js"></script></body></html>
