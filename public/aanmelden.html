<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Moskee aanmelden · OrangePOS</title><link rel="stylesheet" href="/portal.css"></head><body><main class="auth"><section class="auth-visual"><h1>Start vandaag met digitaal doneren.</h1><p>Een eigen donatiescherm, dagelijkse gebedstijden en een overzichtelijke beheerconsole.</p></section><section class="auth-form"><form class="panel" id="form"><span class="mark">✦</span><h2>Moskee aanmelden</h2><p>Maak gratis uw beheeromgeving aan.</p><div class="fields"><label>Moskeenaam<input name="organization" required></label><label>Plaats<input name="city" required></label><label class="wide">E-mailadres<input name="email" type="email" autocomplete="email" required></label><label class="wide">Wachtwoord<input name="password" type="password" minlength="8" autocomplete="new-password" required></label></div><button class="primary">Account aanmaken →</button><p class="error" id="error"></p><p class="switch">Al een account? <a href="/inloggen">Inloggen</a></p></form></section></main><script type="module" src="/signup.js"></script></body></html>
