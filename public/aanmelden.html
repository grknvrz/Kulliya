<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Moskee aanmelden · OrangePOS</title><link rel="stylesheet" href="/portal.css"><style>.terms-check{display:flex!important;align-items:flex-start;gap:10px;margin:18px 0 0}.terms-check input{width:20px;height:20px;margin:1px 0 0;flex:0 0 auto}.terms-check span{font-weight:400;line-height:1.45}.terms-check a{color:var(--green);font-weight:800}</style></head><body><main class="auth"><section class="auth-visual"><h1>Start vandaag met digitaal doneren.</h1><p>Een eigen donatiescherm, dagelijkse gebedstijden en een overzichtelijke beheerconsole.</p></section><section class="auth-form"><form class="panel" id="form"><span class="mark">✦</span><h2>Moskee aanmelden</h2><p>Maak gratis uw beheeromgeving aan. De eerste bestuurder wordt direct hoofdbeheerder.</p><div class="fields"><label>Moskeenaam<input name="organization" required></label><label>Plaats<input name="city" required></label><label>Voornaam bestuurder<input name="firstName" autocomplete="given-name" required></label><label>Achternaam bestuurder<input name="lastName" autocomplete="family-name" required></label><label class="wide">E-mailadres bestuurder<input name="email" type="email" autocomplete="email" required></label><label class="wide">Wachtwoord<input name="password" type="password" minlength="8" autocomplete="new-password" required></label></div><label class="terms-check"><input name="acceptedTerms" type="checkbox" required><span>Ik ben bevoegd namens de moskee en accepteer de <a href="/algemene-voorwaarden.html" target="_blank">algemene voorwaarden</a>, waaronder het uitsluitend toegestane gebruik voor moskeedoeleinden.</span></label><button class="primary">Account aanmaken →</button><p class="error" id="error"></p><p class="switch">Al een account? <a href="/inloggen">Inloggen</a></p></form></section></main><script type="module" src="/signup.js"></script></body></html>
