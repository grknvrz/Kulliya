<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kies uw moskee · OrangeMasjid</title><link rel="stylesheet" href="/portal.css"><style>.chooser{min-height:100vh;padding:50px max(20px,8vw);background:linear-gradient(135deg,#f7f3e9,#e6f2ec)}.chooser>div{max-width:850px;margin:auto}.mosques{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:15px;margin-top:30px}.mosque{display:block;background:white;color:#12332e;text-decoration:none;border:1px solid #dce3df;border-radius:15px;padding:22px;box-shadow:0 8px 25px #12332e0b}.mosque:hover{border-color:#0d6b58;transform:translateY(-2px)}.mosque small{display:block;color:#70807a;margin-top:5px}</style></head><body><main class="chooser"><div><span class="mark">✦</span><h1>Bij welke moskee wilt u lid worden?</h1><p>Selecteer de moskee om haar producten en ledenformulier te openen.</p><div class="mosques" id="mosques"><p>Moskeeën laden…</p></div></div></main><script type="module" src="/mosque-chooser.js"></script></body></html>
