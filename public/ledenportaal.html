<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mijn kwitanties · OrangeMasjid</title><link rel="stylesheet" href="/portal.css"><style>.member-page{min-height:100vh;padding:40px max(20px,6vw);background:linear-gradient(135deg,#f7f3e9,#e9f5ef)}.member-head{display:flex;justify-content:space-between;align-items:center;max-width:1000px;margin:auto}.receipt-wrap{max-width:1000px;margin:35px auto}.receipt{display:grid;grid-template-columns:auto 1fr auto;gap:18px;align-items:center;background:white;border:1px solid #dce3df;border-radius:15px;padding:20px;margin:12px 0}.receipt input{width:22px;height:22px;margin:0}.receipt small{color:#71807b}.total{display:flex;justify-content:space-between;align-items:center;margin-top:25px;background:#082f2a;color:white;padding:22px;border-radius:15px}.total strong{font-size:25px}.status{padding:6px 9px;border-radius:20px;background:#dff3eb;color:#0d6b58;font-size:12px}.member-number{font-family:monospace;background:#fff3d5;padding:8px;border-radius:8px}@media(max-width:600px){.receipt{grid-template-columns:auto 1fr}.receipt>strong{grid-column:2}}</style></head><body><main class="member-page"><header class="member-head"><div><small id="organization"></small><h1>Mijn kwitanties</h1><p>Welkom, <span id="name"></span> · <span class="member-number" id="number"></span></p></div><button id="logout">Uitloggen</button></header><section class="receipt-wrap"><div id="receipts"></div><div class="total"><div><small>Geselecteerd totaal</small><strong id="total">€ 0,00</strong></div><button class="primary" id="pay">Betalen via pinautomaat →</button></div><p class="error" id="error"></p></section></main><script type="module" src="/member-portal.js"></script></body></html>
